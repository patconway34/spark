<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Spark</title>

    <!-- PWA: makes Spark installable so it launches with NO browser chrome.
         display:fullscreen in the manifest drops both the URL bar and the
         Android status bar. Change it to "standalone" if you want the clock and
         battery back. Install from Chrome's ⋮ menu → "Install app" — a plain
         "Add to home screen" shortcut still opens inside Chrome. -->
    <!-- crossorigin="use-credentials" is REQUIRED here, not optional polish.
         Chrome fetches a manifest with credentials OMITTED by default, and it
         also probes start_url ("/") the same way. Spark gates "/" behind
         SPARK_TOKEN, so both arrive tokenless, "/" answers 401, and Chrome
         quietly decides the app is not installable — no error, no prompt, every
         other criterion passing. This attribute makes Chrome send the cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
    <meta name="theme-color" content="#3c3836">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spark">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=11.0">
    <!-- UI colors from theme.json (overrides style.css :root). Edit theme.json,
         restart the Spark app, and refresh to recolor the chrome. -->
    <style>
    :root {
        --bg: {{ theme_ui.bg }};
        --surface: {{ theme_ui.surface }};
        --surface-bright: {{ theme_ui.surface_bright }};
        --border: {{ theme_ui.border }};
        --border-strong: {{ theme_ui.border_strong }};
        --text: {{ theme_ui.text }};
        --text-dim: {{ theme_ui.text_dim }};
        --text-muted: {{ theme_ui.text_muted }};
        --accent: {{ theme_ui.accent }};
        --accent-dim: {{ theme_ui.accent_dim }};
        --accent-glow: {{ theme_ui.accent_glow }};
        --control-bg: {{ theme_ui.control_bg }};
    }
    body[class*="theme-"] { --theme: {{ theme_ui.accent }}; --theme-dim: {{ theme_ui.theme_dim }}; }
    </style>
</head>
<body tabindex="-1">

<!-- File rail: tap-to-insert path picker. Overlay, not a layout column — see
     the note in style.css about why shrinking the terminal is a bad idea. -->
<!-- Diff / file preview. Full-screen dismissible sheet; see style.css for why
     this is not a side column. -->



{% for s in sessions %}
<div class="terminal-wrap{% if s.id != session.id %} term-hidden{% endif %}" id="wrap-{{ s.id }}">
<iframe id="term-{{ s.id }}" class="terminal-frame" data-local="{{ s.local_url }}" data-remote="{{ s.remote_url }}" data-bg="{{ s.bg }}"></iframe>
</div>
{% endfor %}

<div id="controls">
    <!-- Hamburger menu — grouped, 36px targets. All styling is in style.css
         (#hamburger-panel), NOT inline: this used to be 24 copies of the same
         style="" string, so every size tweak meant 24 edits. -->
    <div id="hamburger-panel" style="display:none;">

        <div class="ham-group">
            <div class="ham-label">Answer</div>
            <div class="ham-row">
                <button class="btn key-btn ham-yes" onclick="sendCommand('yes')">Yes</button>
                <button class="btn key-btn ham-no" onclick="sendCommand('no')">No</button>
            </div>
        </div>

        <div class="ham-group">
            <div class="ham-label">Session</div>
            <div class="ham-row">
                <button class="btn key-btn" onclick="sendCommand('/new')">/new</button>
                <button class="btn key-btn" onclick="sendCommand('/compact')">/compact</button>
            </div>
            {% if model_buttons %}
            <div class="ham-row">
                {% for b in model_buttons %}
                <button class="btn key-btn" onclick="sendCommand('{{ b.command }}')">{{ b.label }}</button>
                {% endfor %}
            </div>
            {% endif %}
        </div>

        <div class="ham-group">
            <div class="ham-label">Keys</div>
            <div class="ham-row">
                <button class="btn key-btn" onclick="sendKey('Tab')">Tab</button>
                <button class="btn key-btn" onclick="sendKey('BTab')">&#8679;Tab</button>
                <button class="btn key-btn" onclick="sendKey('Up')">&#9650;</button>
                <button class="btn key-btn" onclick="sendKey('Down')">&#9660;</button>
            </div>
            <div class="ham-row">
                <button class="btn key-btn" onclick="sendKey('C-u')">Clear</button>
                <button class="btn key-btn" onclick="sendKey('C-c')">^C</button>
                <button class="btn key-btn" onclick="sendKey('C-z')">^Z</button>
            </div>
            <div class="ham-row">
                <button class="btn key-btn" onclick="sendCommand('1')">1</button>
                <button class="btn key-btn" onclick="sendCommand('2')">2</button>
                <button class="btn key-btn" onclick="sendCommand('3')">3</button>
            </div>
        </div>

        <div class="ham-group">
            <div class="ham-label">Voice</div>
            <div class="ham-row">
                <button class="btn key-btn" onclick="textMe()">&#128242; Text</button>
                <button class="btn key-btn" onclick="playMe()">&#128266; Play</button>
                <button class="btn key-btn" onclick="listenMe()">&#127911; Listen</button>
            </div>
        </div>

        <div class="ham-group">
            <div class="ham-label">Dev</div>
            <div class="ham-row">
            </div>
            <div class="ham-row">
                <button class="btn key-btn" onclick="saveScreenshot()">&#128247; Save</button>
                <button class="btn key-btn" onclick="copyScreen()">&#128203; Copy</button>
            </div>
        </div>

        <div class="ham-group">
            <div class="ham-label">View</div>
            <div class="ham-row">
                <button id="text-size-btn" class="btn key-btn" onclick="toggleTextSize()">&#128269; Big Text</button>
                <button class="btn key-btn" onclick="window.location='/config'">&#9881; Config</button>
            </div>
        </div>

    </div>

    <!-- Terminal tabs — one solid-colored button per terminal; tap or swipe to flip -->
    <div id="term-bar"></div>

    <!-- Row 2: Hamburger | PgUp | PgDn | Type bar -->
    <div style="display:flex; gap:0.3rem; padding:0 0.2rem; align-items:center;">
        <button class="btn key-btn" onclick="toggleHamburger()" style="font-size:0.7rem; flex:0 0 38px; height:32px; padding:0;">☰</button>
        <button class="btn key-btn" onclick="scrollTerminal('up')" style="font-size:0.5rem; flex:0 0 38px; height:32px; padding:0;">PgUp</button>
        <button class="btn key-btn" onclick="scrollTerminal('down')" style="font-size:0.5rem; flex:0 0 38px; height:32px; padding:0;">PgDn</button>
        <input id="type-bar" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="Type here..."
            style="flex:1; min-width:0; height:32px; border:1px solid var(--border-strong); border-radius:6px; padding:0 8px; font-size:0.85rem; font-family:var(--font-mono); background:#ffffff; color:#232323;">
        <button class="btn key-btn" onclick="sendTyped()" style="height:32px; font-size:0.7rem; padding:0 10px; font-weight:600; flex:0 0 auto;">SEND</button>
        <button class="btn key-btn" onclick="reloadTerminal()" style="height:32px; font-size:0.6rem; padding:0 6px; flex:0 0 auto;" title="Reload terminal">&#x21bb;</button>
    </div>

    <!-- Row 2: ESC | MIC | ENTER -->
    <div class="key-row" style="gap:0.5rem;">
        <button class="btn big-btn btn-esc" onclick="sendKey('Escape')" style="flex:1;height:42px;">ESC</button>
        <button id="mic-btn" class="btn big-btn btn-mic" onclick="toggleMic()">MIC</button>
        <button class="btn big-btn btn-enter" onclick="pressEnter()" style="flex:1;height:42px;">ENTER</button>
    </div>
    <!-- Bottom buffer to keep the controls above the Android gesture/nav bar.
         Intentional — do NOT trim this (confirmed needed on Patrick's Android).
         2026-09-30: height moved to #bottom-buffer in style.css so it can shrink
         when UNFOLDED, where the nav bar isn't eating it. The folded value is
         still exactly 60px — the "do not trim" warning above applies to the
         folded case and is preserved. -->
    <div id="bottom-buffer"></div>
</div>

<script>
// --- TEMP mobile diagnostics: report JS errors + load beacons to spark.log ---
// (First thing in the script so it catches errors in everything below.)
(function(){
  function beacon(m){ try{ fetch('/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:'[CLIENT] '+m})}); }catch(e){} }
  window.__beacon = beacon;
  window.addEventListener('error', function(e){ beacon('JS ERROR: '+(e.message||'')+' @ '+((e.filename||'').split('/').pop())+':'+(e.lineno||'')+':'+(e.colno||'')); });
  window.addEventListener('unhandledrejection', function(e){ beacon('PROMISE REJECT: '+((e.reason&&e.reason.message)||e.reason||'')); });
  beacon('script START ua='+navigator.userAgent.slice(0,90));
  window.addEventListener('DOMContentLoaded', function(){ beacon('DOMContentLoaded'); });
  window.addEventListener('load', function(){ beacon('window load fired'); });
  // Layout snapshot 1.8s after load: is content actually on screen?
  window.addEventListener('load', function(){ setTimeout(function(){
    try {
      var c = document.getElementById('controls');
      var aw = document.querySelector('.terminal-wrap:not(.term-hidden)');
      var af = aw && aw.querySelector('.terminal-frame');
      var loaded = 'n/a';
      try { loaded = (af && af.contentDocument) ? 'same-origin-doc:'+(af.contentDocument.body?af.contentDocument.body.childElementCount:'nobody') : 'no-contentDoc'; } catch(e){ loaded = 'cross-origin('+e.name+')'; }
      beacon('LAYOUT win='+innerWidth+'x'+innerHeight
        +' controlsH='+(c?c.offsetHeight:'MISSING')
        +' activeWrap='+(aw?aw.id:'NONE')
        +' iframeSrc='+(af?(af.src||'EMPTY').slice(-22):'NOIFRAME')
        +' iframe='+loaded
        +' bodyH='+document.body.offsetHeight);
    } catch(e){ beacon('LAYOUT ERR '+e.message); }
  }, 1800); });
})();

// --- Terminal iframe URLs (LAZY: only the visible terminal is ever loaded) ---
// All 4 terminals are same-origin now, so Chrome runs every iframe in ONE
// renderer process. Four xterm.js instances (each with a large scrollback) in
// a single process overruns mobile's per-process memory and the renderer
// crashes to a white page. So we load ONLY the active session's iframe and
// blank the rest; switching loads the target and unloads the previous.
function _frameUrl(f) {
    const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
    return isLocal ? f.dataset.local : f.dataset.remote;
}
// ttyd's xterm focuses a hidden textarea on connect; on mobile that focus
// flashes the soft keyboard for a moment. The frame is same-origin on the
// phone, so as soon as that textarea appears, mark it readonly + inputmode=none
// — a readonly field can't raise the keyboard even when focused, so no flash.
// (Input never uses this field anyway; it all goes backend via send-keys.)
function _suppressFrameKeyboard(f) {
    let tries = 0;
    const iv = setInterval(() => {
        let ta = null;
        try { ta = f.contentDocument && f.contentDocument.querySelector('.xterm-helper-textarea'); }
        catch (e) { clearInterval(iv); return; }  // cross-origin (localhost dev) — no mobile keyboard to worry about
        if (ta) {
            ta.setAttribute('readonly', 'readonly');
            ta.setAttribute('inputmode', 'none');
            ta.blur();
            clearInterval(iv);
        } else if (++tries > 25) {
            clearInterval(iv);
        }
    }, 120);
}
// Paint ttyd's own page background (html/body) with the terminal's tint so any
// area not covered by the xterm rows — e.g. the strip at the bottom — shows the
// pale tint instead of ttyd's default black. Same-origin on the tunnel; on
// localhost dev it's cross-origin and silently no-ops. Re-applied on each load.
function _paintFrameBg(f) {
    const bg = f.dataset.bg;
    if (!bg) return;
    try {
        const doc = f.contentDocument;
        if (!doc || !doc.head) return;
        let st = doc.getElementById('__spark_bg');
        if (!st) { st = doc.createElement('style'); st.id = '__spark_bg'; doc.head.appendChild(st); }
        st.textContent = `html,body{background:${bg} !important;}`;
    } catch (e) { /* cross-origin (localhost dev) — ignore */ }
}
function _onFrameLoad(f) {
    _suppressFrameKeyboard(f);
    _paintFrameBg(f);
    // ttyd may repaint its body shortly after connect; re-assert the tint once.
    setTimeout(() => _paintFrameBg(f), 400);
}
// Keep the most-recently-viewed terminals loaded so switching back (and short
// swipe runs) is instant instead of reloading the iframe every time. Capped to
// bound mobile-renderer memory: raise MAX_LOADED for smoother switching across
// more terminals, lower it (min 1) if the renderer ever runs out of memory.
const MAX_LOADED = 3;
let _loadedOrder = [];
function _markLoaded(id) {
    if (!id) return;
    _loadedOrder = [id].concat(_loadedOrder.filter(x => x !== id));
}
function loadActiveTerminal() {
    const wrap = document.querySelector('.terminal-wrap:not(.term-hidden)');
    const f = wrap && wrap.querySelector('.terminal-frame');
    if (!f) return;
    _markLoaded(wrap.id.replace('wrap-', ''));
    const blank = !f.src || f.src === 'about:blank' || f.src.startsWith('about:');
    if (blank) {
        f.src = _frameUrl(f);
        f.addEventListener('load', () => _onFrameLoad(f), { once: true });
    }
}
function unloadInactiveTerminals() {
    // Blank only terminals that fell out of the recent (MAX_LOADED) set, so the
    // recent ones stay live for instant switch-back. ttyd's leave-alert is
    // disabled (start.sh -t disableLeaveAlert=true) so blanking is silent.
    const keep = new Set(_loadedOrder.slice(0, MAX_LOADED));
    keep.add(ACTIVE_SESSION);
    document.querySelectorAll('.terminal-wrap').forEach(w => {
        const id = w.id.replace('wrap-', '');
        const f = w.querySelector('.terminal-frame');
        if (f && !keep.has(id) && f.src && !f.src.startsWith('about:')) {
            f.src = 'about:blank';
        }
    });
}
loadActiveTerminal();

// Warm the ACTIVE terminal and its nearest neighbours — never more than
// MAX_LOADED of them.
//
// This used to warm EVERY terminal ("with only 3 terminals, warm them ALL"),
// written when there were three. At seven that booted seven websockets and
// seven xterm instances on a budget of three, and unloadInactiveTerminals then
// blanked four of them right back. Worse, _markLoaded prepends, so walking the
// DOM front-to-back left _loadedOrder holding the LAST three terminals in DOM
// order — the warm set was pinned to tabs 5-7 no matter which tab you were on,
// so every ±1 switch from anywhere else was a cold load.
//
// You navigate with left/right (D-pad, swipe, shift+F3/F4), so ±1 is nearly all
// of your movement. Warming active/+1/-1 spends the same three-iframe budget on
// the terminals you are actually about to reach.
function preloadNearbyTerminals() {
    const wraps = Array.from(document.querySelectorAll('.terminal-wrap'));
    if (!wraps.length) return;
    const idOf = w => w.id.replace('wrap-', '');
    let idx = wraps.findIndex(w => idOf(w) === ACTIVE_SESSION);
    if (idx < 0) idx = 0;
    // Active first, then alternating neighbours: idx, +1, -1, +2, -2, ...
    const cap = Math.min(MAX_LOADED, wraps.length);
    const want = [];
    for (let d = 0; want.length < cap; d++) {
        const step = d === 0 ? [idx]
            : [(idx + d) % wraps.length, (idx - d + wraps.length) % wraps.length];
        for (const j of step) {
            if (want.length < cap && !want.includes(j)) want.push(j);
        }
    }
    // Mark in reverse so the active terminal is marked LAST and therefore lands
    // at the front of _loadedOrder (_markLoaded prepends) — it must never be the
    // one that falls out of the keep set.
    want.slice().reverse().forEach(i => _markLoaded(idOf(wraps[i])));
    want.forEach(i => {
        const f = wraps[i].querySelector('.terminal-frame');
        if (!f) return;
        if (!f.src || f.src.startsWith('about:')) {
            f.src = _frameUrl(f);
            f.addEventListener('load', () => _onFrameLoad(f), { once: true });
        }
    });
    unloadInactiveTerminals();
}
setTimeout(preloadNearbyTerminals, 500);

// Re-warm after a switch so ±1 from the NEW tab is hot too. Debounced: a fast
// swipe run would otherwise load every terminal it passes through.
let _warmTimer = null;
function scheduleNeighbourWarm() {
    clearTimeout(_warmTimer);
    _warmTimer = setTimeout(preloadNearbyTerminals, 400);
}

// Mobile Chrome freezes/discards backgrounded tabs; a bfcache restore brings
// the page back WITHOUT re-running this script, leaving iframes blank (white).
// On a bfcache restore, force a full fresh reload (/ is no-store). On a plain
// visibility flip, just re-load the active terminal if it was blanked.
window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') loadActiveTerminal();
});

// --- State ---
let listening = false;
let audioStream = null;
let recorder = null;
let chunks = [];
let _sessions = [];
let ACTIVE_SESSION = '{{ session.id }}';

function setStatus(text, persist = false) {
    let toast = document.getElementById('spark-toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'spark-toast';
        toast.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 18px;border-radius:8px;font-size:0.85rem;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:90vw;text-align:center;';
        document.body.appendChild(toast);
    }
    toast.textContent = text;
    toast.style.opacity = '1';
    clearTimeout(toast._tid);
    if (!persist) toast._tid = setTimeout(() => { toast.style.opacity = '0'; }, 3000);
}

function sparkLog(msg) {
    fetch('/api/log', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({msg})}).catch(()=>{});
}

// --- Push-to-talk ---
// Enter while recording = stop → transcribe → paste → send in one go.
function pressEnter() {
    if (listening) { toggleMic(true); return; }
    sendKey('Enter');
}

async function toggleMic(sendAfter = false) {
    const btn = document.getElementById('mic-btn');
    if (listening) {
        // Stop recording → transcribe → send
        listening = false;
        btn.classList.remove('recording');
        btn.textContent = 'MIC';
        setStatus('Transcribing...', true);

        if (recorder && recorder.state === 'recording') {
            const blob = await new Promise(resolve => {
                recorder.onstop = () => resolve(new Blob(chunks, {type: recorder.mimeType}));
                recorder.stop();
            });

            const ext = blob.type.includes('webm') ? 'webm' : 'm4a';
            const formData = new FormData();
            formData.append('audio', blob, `recording.${ext}`);

            try {
                const res = await fetch('/api/transcribe', {method: 'POST', body: formData});
                const data = await res.json();
                if (data.text && data.text.trim()) {
                    const text = data.text.trim();
                    // Paste directly into terminal — await so a follow-up Enter lands after the text
                    await fetch('/api/paste-text', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, session: ACTIVE_SESSION})});
                    if (sendAfter) {
                        await sendKey('Enter');
                        setStatus('Sent');
                    } else {
                        setStatus('Pasted — mic again or hit ENTER');
                    }
                    sparkLog('TRANSCRIBED: ' + text);
                } else {
                    setStatus('No speech detected');
                }
            } catch(e) {
                setStatus('Transcribe failed');
                sparkLog('TRANSCRIBE_ERR: ' + e.message);
            }
        } else {
            setStatus('Nothing recorded');
        }

        if (audioStream) {
            audioStream.getTracks().forEach(t => t.stop());
            audioStream = null;
        }
        recorder = null;
        chunks = [];
    } else {
        // Start recording
        try {
            audioStream = await navigator.mediaDevices.getUserMedia({audio: true});
            chunks = [];
            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
            recorder = new MediaRecorder(audioStream, {mimeType});
            recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.start();
            listening = true;
            btn.classList.add('recording');
            btn.textContent = 'REC';
            setStatus('Recording...', true);
            sparkLog('MIC_ON');
        } catch(e) {
            setStatus('Mic access denied');
            sparkLog('MIC_DENIED: ' + e.message);
        }
    }
}

// --- Type bar ---
function sendTyped() {
    const input = document.getElementById('type-bar');
    const text = input.value.trim();
    if (!text) return;
    sendCommand(text);
    input.value = '';
    setStatus('Sent');
}
document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('type-bar');
    if (input) {
        input.addEventListener('keydown', (e) => {
            // Ctrl+M toggles mic (even while typing) — must check before Enter
            // because Ctrl+M = ASCII 13 = carriage return in some browsers
            if (e.ctrlKey && e.code === 'KeyM') { e.preventDefault(); toggleMic(); return; }
            if (e.key === 'Enter' && !e.ctrlKey) { e.preventDefault(); sendTyped(); }
            e.stopPropagation(); // don't let keyboard router intercept typing
        });
    }
});

// --- Hotkey: toggle mic ---
// Works with: Ctrl+M (desktop), F9 (AHK remap), double-tap Enter/PageDown (clicker)
// NOTE: Volume keys (AudioVolumeUp) do NOT reach JS on Android — OS intercepts them.
let _lastMicKey = 0;
const MIC_DOUBLE_TAP_MS = 400;

// --- Key debugger ---
// Load Spark with ?keys=1 to turn it on. Every keypress is then captured,
// echoed to the status line AND logged to spark.log as "KEY: ...", and nothing
// else fires — no mic, no Enter, no session switch. That is deliberate: it is
// how you find out what a controller button ACTUALLY sends.
//
// The device's own 8BitDo profile is the only source of truth. The screenshots
// in "Button Map and Procedure" go stale (there are three of them, from three
// different dates, mapping the same buttons to different keys), and Android
// silently drops anything above F12 as "Unidentified". Probe, don't guess.
//
// Reload without ?keys=1 to turn it back off.
// Server flag wins (see _KEYDEBUG_FLAG in app.py) because the phone opens Spark
// from a home-screen PWA shortcut with a fixed URL, where ?keys=1 never
// survives. The query param is kept for desktop.
let _debugMode = {{ 'true' if key_debug else 'false' }}
                 || new URLSearchParams(location.search).has('keys');
let _debugKeys = [];
let _debugTimer = null;
if (_debugMode) {
    // NOT window 'load' — that waits on the three ttyd iframes and can be many
    // seconds late (or never), so the banner would never appear.
    setTimeout(() => setStatus('KEY DEBUG ON — press buttons, nothing else will fire'), 0);
}

// --- PWA registration + silent environment log ---
// Registers the service worker (see /sw.js in app.py) and records, once per
// load, whether Spark is running as the INSTALLED app or as a browser tab.
//
// Log-only on purpose. The toast version of this was scaffolding for the
// 2026-09-30 install work and is gone; the log line stays because the two modes
// get different bottom padding (see the display-mode block in style.css), so
// "which mode was I in?" is the first question worth answering if the spacing
// ever looks wrong again. Nothing here is user-visible.
async function _logPwaEnv() {
    const mode = window.matchMedia('(display-mode: fullscreen)').matches ? 'fullscreen'
               : window.matchMedia('(display-mode: standalone)').matches ? 'standalone'
               : 'browser-tab';
    let sw = 'sw:none';
    try {
        await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;
        sw = 'sw:OK' + (navigator.serviceWorker.controller ? '+controlling' : '+NOT-controlling');
    } catch (e) {
        sw = 'sw:FAIL(' + e.message + ')';
    }
    const pad = getComputedStyle(document.documentElement)
                    .getPropertyValue('--safe-bottom').trim() || '0px';
    fetch('/api/log', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({msg: `PWA mode:${mode} | ${sw} | width:${window.innerWidth} | pad:${pad}`})
    }).catch(()=>{});
}
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { _logPwaEnv(); });
}

document.addEventListener('keydown', (e) => {
    if (_debugMode) {
        const mods = [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Meta'].filter(Boolean).join('+');
        const label = (mods ? mods + '+' : '') + e.key + ' [' + e.code + ' #' + e.keyCode + ']';
        _debugKeys.push(label);
        clearTimeout(_debugTimer);
        _debugTimer = setTimeout(() => {
            const msg = 'KEY: ' + _debugKeys.join(' → ');
            setStatus(msg);
            fetch('/api/log', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({msg})}).catch(()=>{});
            _debugKeys = [];
        }, 300);
        e.preventDefault();
        return;
    }

    // Skip if typing in the type-bar — all hotkeys disabled while typing
    if (e.target.id === 'type-bar') return;

    // --- Mic toggle (desktop) ---
    if (e.ctrlKey && e.code === 'KeyM') { e.preventDefault(); toggleMic(); return; }

    // --- 8BitDo Profile 2 — REMAPPED 2026-10-01 (Patrick), new controller ---
    // Patrick replaced the controller: D-pad Down (F7) now fires (the old unit
    // had a dead micro switch), and R2 genuinely sends Shift+F7 — on the old
    // unit R2 emitted a bare ShiftLeft and nothing else, which is why Clear sat
    // on an unreachable binding for days. Probed, not assumed.
    //
    // This restores the pre-2026-09-29 feel: the d-pad drives the things done
    // constantly (mic, send, terminal left/right), face buttons hold the
    // occasional jobs. Every entry below is one physical button.
    //
    // PHYSICAL BUTTON -> KEY -> ACTION
    //   D-pad Left   F1         Mic on/off
    //   D-pad Right  F2         Enter / send
    //   D-pad Up     F9         Terminal right
    //   D-pad Down   Shift+E    Terminal left   (NOT F7 — see note below)
    //   L            F4         Escape
    //   L2           F8         Clear typed line (C-u)
    //   "-"          F12        Page up
    //   "+"          F10        Page down
    //   *            Shift+F1   /new
    //   A            Shift+F2   Refresh page
    //   B            Shift+F3   Play/Pause read-back
    //   X            Shift+F4   Tab
    //   R            Shift+F5   Listen (full reply read aloud)
    //   R2           Shift+W    Big text / car mode  (NOT Shift+F7 — see note)
    //   Y            Shift+F8   Voice summary
    //
    // Any key must be F1-F12 or Shift+F1-F12: Android delivers nothing above
    // F12 to the browser (F13+ arrive as "Unidentified"). F6 stays unbound —
    // holding the controller's home key powers it off and spams F6.

    // --- Shifted layer (face buttons + shoulders) ---
    if (e.shiftKey && e.key === 'F1') { e.preventDefault(); sendCommand('/new'); setStatus('/new'); return; }  // *  — /new
    if (e.shiftKey && e.key === 'F2') { e.preventDefault(); refreshPage(); return; }                           // A  — Refresh page
    if (e.shiftKey && e.key === 'F3') { e.preventDefault(); listenPlayPause(); return; }                       // B  — Play/Pause read-back
    if (e.shiftKey && e.key === 'F4') { e.preventDefault(); sendKey('Tab'); return; }                           // X  — Tab
    if (e.shiftKey && e.key === 'F5') { e.preventDefault(); listenMe(); return; }                               // R  — Listen (full read)
    // R2 sends Shift+W, not Shift+F7. PROBED 2026-10-01: F7 has now failed
    // twice on this hardware — base F7 (D-pad Down) never arrived, and Shift+F7
    // from R2 never arrived either, on two different controllers. Shift+letter
    // combos reach the browser reliably, F7 evidently does not, so both of the
    // ex-F7 buttons are letters now. Probe logged `Shift+W [KeyW #87]`.
    // e.code again, so case and layout cannot break it.
    if (e.shiftKey && e.code === 'KeyW') { e.preventDefault(); toggleTextSize(); return; }  // R2 — Big text / car mode
    if (e.shiftKey && e.key === 'F7') { e.preventDefault(); toggleTextSize(); return; }     // (Shift+F7 kept as a fallback)
    if (e.shiftKey && e.key === 'F8') { e.preventDefault(); summaryMe(); return; }                               // Y  — Voice summary
    // D-pad Down sends Shift+E, not F7. PROBED 2026-10-01: on both the old and
    // the new controller, D-pad Down produced NO keydown at all — the browser
    // never saw it, so the long-standing "broken micro switch" note in this file
    // was wrong; the button simply was not mapped. Patrick assigned Shift+E in
    // the 8BitDo app and the probe logged `Shift+E [KeyE #69]`.
    // Matched on e.code, not e.key: with Shift held, e.key is the uppercase "E",
    // and e.code is immune to case and keyboard layout.
    // Being a letter, this one types into the type-bar if that has focus — the
    // handler bails out while typing, so that is expected, not a bug.
    if (e.shiftKey && e.code === 'KeyE') { e.preventDefault(); switchSessionByOffset(-1); return; }  // D-pad Down — Terminal left

    // --- Base layer (d-pad + L/L2 + volume rocker) ---
    if (e.shiftKey || e.ctrlKey || e.altKey) return;  // base layer = unmodified keys only
    if (e.key === 'F1')  { e.preventDefault(); toggleMic(); return; }                       // D-pad Left  — Mic
    if (e.key === 'F2')  { e.preventDefault(); pressEnter(); return; }                      // D-pad Right — Enter
    if (e.key === 'F9')  { e.preventDefault(); switchSessionByOffset(1); return; }          // D-pad Up    — Terminal right
    if (e.key === 'F7')  { e.preventDefault(); switchSessionByOffset(-1); return; }         // (F7 kept as a fallback — the controller sends Shift+E instead)
    if (e.key === 'F4')  { e.preventDefault(); sendKey('Escape'); return; }                 // L           — Escape
    // Clear is C-u, the same key the hamburger's Clear sends, so the button and
    // the menu can never disagree about what "clear" means.
    if (e.key === 'F8')  { e.preventDefault(); sendKey('C-u'); return; }                    // L2          — Clear typed line
    if (e.key === 'F12') { e.preventDefault(); scrollTerminal('up'); return; }              // "-"         — Page up
    if (e.key === 'F10') { e.preventDefault(); scrollTerminal('down'); return; }            // "+"         — Page down

    // --- Send ---
    if (e.key === 'Enter' && !e.ctrlKey) { e.preventDefault(); pressEnter(); return; }  // 8BitDo B

    // --- Scroll terminal ---
    if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); scrollTerminal('up'); return; }   // 8BitDo D-pad Up
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); scrollTerminal('down'); return; }  // 8BitDo D-pad Down

    // --- Tab switching ---
    if (e.key === 'ArrowLeft') { e.preventDefault(); switchSessionByOffset(-1); return; }   // 8BitDo D-pad Left
    if (e.key === 'ArrowRight') { e.preventDefault(); switchSessionByOffset(1); return; }   // 8BitDo D-pad Right

    // --- Remaining keys forwarded to tmux ---
    if (e.key === 'Escape') { e.preventDefault(); sendKey('Escape'); return; }   // 8BitDo L shoulder
    if (e.key === 'Tab') { e.preventDefault(); sendKey('Tab'); return; }
    if (e.key === 'Backspace') { e.preventDefault(); sendKey('BSpace'); return; }
});

// --- Key/nav helpers ---
async function sendKey(key) {
    try {
        const res = await fetch('/api/key', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({key, session: ACTIVE_SESSION}),
        });
        if (!res.ok) {
            const d = await res.json().catch(() => ({}));
            setStatus('Key failed: ' + (d.error || res.status));
        }
    } catch(e) {
        setStatus('Key failed — retrying...');
        try {
            await fetch('/api/key', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key, session: ACTIVE_SESSION})});
        } catch(e2) {
            setStatus('Key failed — check connection');
        }
    }
}

// Throttle scroll so held-down keys (8BitDo d-pad auto-repeat fires every
// ~30ms) can't fling the buffer to the top. One deliberate press = one
// half-page; auto-repeat within the window is dropped. Deliberate taps are
// slower than 200ms apart, so they still get through.
let _lastScroll = 0;
function scrollTerminal(direction) {
    const now = Date.now();
    if (now - _lastScroll < 200) return;
    _lastScroll = now;
    fetch('/api/scroll', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({direction, session: ACTIVE_SESSION})});
}

function sendCommand(text) {
    fetch('/api/voice-text', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, session: ACTIVE_SESSION})});
}

function saveScreenshot() {
    setStatus('Saving...');
    fetch('/api/screenshot/save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session: ACTIVE_SESSION})})
        .then(r => r.json().then(d => {
            if (r.ok) setStatus('Screenshot saved');
            else setStatus('Save failed: ' + (d.error || 'empty screen'));
        }))
        .catch(() => setStatus('Save failed: server error'));
}

// REFRESH (2026-09-29). The button Patrick reached for after every code change:
// the phone runs Spark as a PWA with no address bar, so a hard refresh meant
// closing and reopening the app. `/` is served no-store, so a plain reload
// fetches the page fresh - that IS the hard refresh here, no cache-buster
// needed. It took ← from the SMS summary, which stays in the hamburger (📲).
function refreshPage() {
    setStatus('↻ refreshing');
    location.reload();
}

function textMe() {
    setStatus('Sending text...');
    fetch('/api/text-me', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session: ACTIVE_SESSION})})
        .then(r => r.json().then(d => {
            if (!r.ok) { setStatus('Text failed: ' + (d.error || 'unknown')); return; }
            setStatus('Summarizing...');
            // Poll for result every 2s, up to 30s
            let checks = 0;
            const poll = setInterval(() => {
                checks++;
                fetch('/api/text-status/' + d.job).then(r => r.json()).then(s => {
                    if (s.status === 'sent') { clearInterval(poll); setStatus('Text sent!'); }
                    else if (s.status === 'failed') { clearInterval(poll); setStatus('Text failed'); }
                    else if (s.status === 'timeout') { clearInterval(poll); setStatus('Text timed out'); }
                    else if (checks >= 15) { clearInterval(poll); setStatus('Text still processing...'); }
                }).catch(() => {});
            }, 2000);
        }))
        .catch(() => setStatus('Text failed: server error'));
}

function playMe() {
    setStatus('Generating audio...');
    fetch('/api/play-me', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session: ACTIVE_SESSION})})
        .then(r => r.json().then(d => {
            if (!r.ok) { setStatus('Play failed: ' + (d.error || 'unknown')); return; }
            setStatus('Summarizing → TTS...');
            let checks = 0;
            const poll = setInterval(() => {
                checks++;
                fetch('/api/text-status/' + d.job).then(r => r.json()).then(s => {
                    if (s.status === 'sent') { clearInterval(poll); setStatus('Audio sent!'); }
                    else if (s.status === 'failed') { clearInterval(poll); setStatus('Play failed'); }

// --- In-browser listen: summarize + TTS, played right here ---
let _listenPlayer = null;
// Tiny silent wav — played on the button tap to unlock mobile autoplay,
// so the real mp3 can start later without a second gesture.
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';

// Y button: full read-back of Claude's last reply.
function listenMe() { _startListen('listen', '🎧'); }
// X button: 1-3 sentence spoken summary of the same reply.
function summaryMe() { _startListen('vsummary', '📝'); }

// Listen costs real money (notify.py's listen/vsummary run on the Anthropic
// API key, not the subscription), and a HELD controller button auto-repeats
// ~10-26x/second. Same shape as the scroll throttle above: one deliberate
// press gets through, auto-repeat inside the window is dropped. The server
// enforces this too (_LISTEN_COOLDOWN) — this half just spares the round trip.
let _lastListen = 0;
const LISTEN_THROTTLE_MS = 1500;

function _startListen(mode, icon) {
    const now = Date.now();
    if (now - _lastListen < LISTEN_THROTTLE_MS) {
        setStatus('Already working on it...');
        return;
    }
    _lastListen = now;
    const _pressT = now;   // TIMING: true end-to-end, press -> audio playing
    // ALWAYS start a brand-new read-back. Never replay or toggle —
    // that's what listenPlayPause() (B button) is for. Both modes share the
    // same _listenPlayer, so B pauses/resumes whichever one is playing.
    if (!_listenPlayer) _listenPlayer = new Audio();
    // Kill whatever's currently loaded so a fresh capture always wins.
    try { _listenPlayer.pause(); } catch (e) {}
    _listenPlayer.src = SILENT_WAV;   // unlock mobile autoplay on the tap
    _listenPlayer.play().catch(() => {});
    setStatus(mode === 'vsummary' ? 'Summarizing...' : 'Generating audio...');
    fetch('/api/listen', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session: ACTIVE_SESSION, mode: mode})})
        .then(r => r.json().then(d => {
            if (!r.ok) { setStatus('Failed: ' + (d.error || 'unknown')); return; }
            setStatus('Summarizing → TTS...');
            let checks = 0;
            const poll = setInterval(() => {
                checks++;
                fetch('/api/text-status/' + d.job).then(r => r.json()).then(s => {
                    if (s.status === 'ready') {
                        clearInterval(poll);
                        const _readyT = ((Date.now() - _pressT) / 1000).toFixed(2);
                        _listenPlayer.src = '/api/listen-audio/' + d.job;
                        _listenPlayer.play()
                            .then(() => {
                                const _playT = ((Date.now() - _pressT) / 1000).toFixed(2);
                                setStatus('Playing (' + _playT + 's)');
                                fetch('/api/log', {method:'POST',
                                    headers:{'Content-Type':'application/json'},
                                    body: JSON.stringify({msg:
                                        `LISTEN_T job=${d.job} CLIENT ready=${_readyT}s `
                                      + `playing=${_playT}s <- true end-to-end`})
                                }).catch(()=>{});
                            })
                            .catch(() => setStatus('Ready — tap ' + icon + ' to play'));
                    }
                    else if (s.status === 'failed') { clearInterval(poll); setStatus('Failed'); }
                    else if (s.status === 'timeout') { clearInterval(poll); setStatus('Timed out'); }
                    else if (checks >= 150) { clearInterval(poll); setStatus('Still processing...'); }
                }).catch(() => {});
            }, 400);   // was 2000ms: up to 2s of dead air after the mp3 was ready.
                       // 150 x 400ms keeps the same ~60s ceiling as 30 x 2000ms.
        }))
        .catch(() => setStatus('Failed: server error'));
}

function listenPlayPause() {
    // B button: pause/resume the CURRENT read-back. Never captures anything new.
    if (!_listenPlayer || !_listenPlayer.src || _listenPlayer.src.includes('data:audio/wav')) {
        setStatus('Nothing to play — tap 🎧 first');
        return;
    }
    if (_listenPlayer.paused) {
        _listenPlayer.play().then(() => setStatus('Playing...')).catch(() => setStatus('Play blocked'));
    } else {
        _listenPlayer.pause();
        setStatus('Paused — press again to resume');
    }
}

function cleanCapture(text) {
    // Strip terminal junk, then join wrapped lines back into paragraphs.
    const lines = text.split('\n').map(l => l
        .replace(/[╭╮╰╯┌┐└┘├┤┬┴┼─━│┃═║▎]/g, ' ')   // box-drawing borders / quote bar
        .replace(/[⏺●⎿✻✽✢❯]/g, ' ')                  // tool bullets / spinners / prompt
        .replace(/ {2,}/g, ' ')
        .trim());
    const out = [];
    for (const line of lines) {
        if (!line) { out.push(''); continue; }
        const isListItem = /^([-*•>]\s|\d+[.)]\s|#)/.test(line);
        const prev = out.length ? out[out.length - 1] : '';
        // Join with previous line unless it ended a sentence or this starts a list item
        if (prev && !isListItem && !/[.:;!?]$/.test(prev)) {
            out[out.length - 1] = prev + ' ' + line;
        } else {
            out.push(line);
        }
    }
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function copyScreen() {
    setStatus('Copying...');
    fetch('/api/screenshot', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session: ACTIVE_SESSION})})
        .then(r => r.json())
        .then(d => {
            if (!d.text) { setStatus('Nothing to copy'); return; }
            d.text = cleanCapture(d.text);
            if (!d.text) { setStatus('Nothing to copy'); return; }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(d.text)
                    .then(() => setStatus('Copied to clipboard'))
                    .catch(() => fallbackCopy(d.text));
            } else {
                fallbackCopy(d.text);
            }
        })
        .catch(() => setStatus('Copy failed: server error'));
}

function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); setStatus('Copied to clipboard'); }
    catch(e) { setStatus('Copy failed — try from localhost'); }
    document.body.removeChild(ta);
}

function reloadTerminal() {
    const frame = document.getElementById('term-' + ACTIVE_SESSION);
    if (frame) {
        frame.src = frame.src;
        setStatus('Reloaded');
        // Steal focus back from iframe after it loads
        setTimeout(() => document.body.focus(), 500);
        setTimeout(() => document.body.focus(), 1500);
    }
}

// Big text is a font size and nothing more.

// 2026-10-01: it used to broadcast a "keep answers short" instruction to all

// 2026-10-02: tried again, scoped to the active terminal only. Patrick said no

function toggleTextSize() {

// HTML-escape, for the few places that still build markup by hand.
const esc = (t) => String(t).replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;');

// The hamburger panel: the one menu left. Lost with the diff sheet it used to
// sit next to; it belongs to the terminal, not the IDE.
function toggleHamburger() {
    const panel = document.getElementById('hamburger-panel');
    panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
}

// --- Keyboard access ------------------------------------------------------
// This grew 27 clickable rows built as divs, which a mouse handles and a
// keyboard cannot: a div is not focusable, so Tab skips it and Enter has
// nothing to act on. Rather than edit every render path, one observer stamps
// role="button" and tabindex="0" onto rows as they appear, and one delegated
// handler turns Enter and Space into a click.
//
// An observer rather than per-render calls because these panes re-render
// constantly now (live refresh, tab switches, folder changes), and a per-site
// approach would always be one forgotten call away from an unreachable row.
const CLICKABLE = ['tr', 'rail-head', 'gfile', 'ol-row', 'arm-row', 'arm-head',
                   'proj-cell', 'fv-cell', 'cp-bf', 'hs', 'gp-c', 'ar-row',
                   'ar-open', 'gb-hist', 'gb-live', 'gb-init', 'git-row',
                   'fv-num', 'gp-back', 'rec-row'];

function armRow(el) {
    if (!el.classList || el.dataset.armed) return;
    for (const c of CLICKABLE) {
        if (el.classList.contains(c)) {
            el.dataset.armed = '1';
            el.setAttribute('role', 'button');
            el.setAttribute('tabindex', '0');
            return;
        }
    }
}

(function () {
    const scan = (node) => {
        if (node.nodeType !== 1) return;
        armRow(node);
        if (node.querySelectorAll) node.querySelectorAll('*').forEach(armRow);
    };
    new MutationObserver(muts => {
        muts.forEach(m => m.addedNodes.forEach(scan));
    }).observe(document.body, {childList: true, subtree: true});
    document.querySelectorAll('*').forEach(armRow);

    // Enter and Space activate, exactly as they would on a real button.
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const el = document.activeElement;
        if (!el || !el.dataset || !el.dataset.armed) return;
        // Not while typing — the type-bar owns Enter.
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
        e.preventDefault();
        el.click();
    });
})();

// --- Session themes ---
function applyTheme(id) {
    document.body.className = document.body.className.replace(/theme-\w+/g, '').trim();
    document.body.classList.add('theme-' + id);
    // Drive --theme from the active session's own color so the ESC/MIC/ENTER
    // buttons and the controls border match the active tab + terminal exactly —
    // for any tab count, independent of the hardcoded CSS theme-N fallbacks.
    const s = (_sessions || []).find(x => x.id === id);
    if (s && s.color) {
        const c = s.color.replace('#', '');
        const r = parseInt(c.substr(0, 2), 16),
              g = parseInt(c.substr(2, 2), 16),
              b = parseInt(c.substr(4, 2), 16);
        const S = document.body.style;
        S.setProperty('--theme', s.color);
        S.setProperty('--theme-dim', `rgba(${r},${g},${b},0.12)`);
        // Contrast label color for solid-themed buttons (MIC) so bright hues get
        // dark text instead of unreadable white.
        S.setProperty('--theme-text',
            (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1a1a1a' : '#ffffff');
        // Chrome (panel, surfaces) stays neutral grey from theme.json 'ui' for a
        // standard look — only the buttons and active tab take the terminal color.
    }
}

// --- Tab navigation helpers ---
// ↑ walks back through terminals in most-recently-used order. Presses within
// NAV_CHAIN_MS chain deeper (1 press = previous, 2 = two back, ...); when the
// window lapses the chain commits as ONE move, so terminals flashed through
// mid-chain don't pollute the recency order. Taps/swipes break any open chain.
const NAV_CHAIN_MS = 3000;
let _mru = [ACTIVE_SESSION];   // session ids, most recent first (current = [0])
let _navChain = null;          // {list, idx} while an ↑-chain is open
let _navChainTimer = null;

function _mruTouch(id) {
    const i = _mru.indexOf(id);
    if (i >= 0) _mru.splice(i, 1);
    _mru.unshift(id);
}

function switchToLastSession() {
    if (!_navChain) {
        // Recency order first, never-visited terminals appended in tab order,
        // current terminal pinned at [0] — ↑ can always reach everything.
        const ids = _sessions.map(s => s.id);
        const list = _mru.filter(id => ids.includes(id));
        ids.forEach(id => { if (!list.includes(id)) list.push(id); });
        const cur = list.indexOf(ACTIVE_SESSION);
        if (cur > 0) { list.splice(cur, 1); list.unshift(ACTIVE_SESSION); }
        if (list.length < 2) return;
        _navChain = { list, idx: 0 };
    }
    _navChain.idx = (_navChain.idx + 1) % _navChain.list.length;
    clearTimeout(_navChainTimer);
    _navChainTimer = setTimeout(() => {
        _navChain = null;
        _mruTouch(ACTIVE_SESSION);   // commit where the chain landed as one move
    }, NAV_CHAIN_MS);
    switchSession(_navChain.list[_navChain.idx], true);
}

function switchSessionByOffset(offset) {
    const ids = _sessions.map(s => s.id);
    const idx = ids.indexOf(ACTIVE_SESSION);
    if (idx < 0) return;
    const next = (idx + offset + ids.length) % ids.length;
    switchSession(ids[next]);
}

// --- Session/tab management ---
// Optimistic + instant switch: flip the UI synchronously so a loaded terminal
// appears with zero delay (no waiting on the network). The backend's active-
// session sync is fire-and-forget — every keystroke/command already carries the
// explicit session id (see sendKey/sendCommand), so routing stays correct even
// before the backend catches up. Previously this AWAITED the POST before showing
// the terminal, which added a full round-trip of latency to every switch.
function switchSession(id, chained) {
    if (id === ACTIVE_SESSION) return;
    if (!chained) {   // direct switch (tap/swipe): breaks any ↑-chain, commits now
        clearTimeout(_navChainTimer);
        _navChain = null;
        _mruTouch(id);
    }
    ACTIVE_SESSION = id;
    document.querySelectorAll('.terminal-wrap').forEach(w => {
        w.classList.toggle('term-hidden', w.id !== 'wrap-' + id);
    });
    // Lazy load: bring up the newly-active terminal, keep the recent ones loaded
    // (MAX_LOADED) for instant switch-back, free the rest (mobile memory).
    loadActiveTerminal();
    unloadInactiveTerminals();
    // Then warm the new tab's neighbours in the background, so the NEXT ±1
    // switch is a visibility flip too. Debounced — a swipe run skips the
    // terminals it passes straight through.
    scheduleNeighbourWarm();
    applyTheme(id);
    renderTabs();
    // Sync backend active session in the background; don't block the UI on it.
    fetch('/api/session', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id}),
    }).catch(() => {});
}


// Rename a terminal. An empty name clears the custom label server-side, so a
// tab can always go back to showing its number.
async function renameSession(id, name) {
    try {
        await fetch('/api/session/rename', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, name}),
        });
        refreshSessions();
    } catch (e) {}
}

// Re-read the session list and repaint the tabs.
async function refreshSessions() {
    try {
        const res = await fetch('/api/sessions');
        const data = await res.json();
        _sessions = data.sessions;
        renderTabs();
        applyTheme(ACTIVE_SESSION);   // keep MIC/ESC/ENTER matched to the active tab
    } catch (e) {}
}

// --- Tabs -----------------------------------------------------------------
// One pill per terminal. A tab carries a NAME and nothing else now — no
// folder, no open file, no view. Left-click switches; right-click (or
// long-press on a touchscreen) renames.
function renderTabs() {
    const bar = document.getElementById('term-bar');
    if (!bar) return;
    bar.innerHTML = '';
    _sessions.forEach(s => {
        const pill = document.createElement('button');
        pill.className = 'term-pill' + (s.id === ACTIVE_SESSION ? ' active' : '');
        pill.innerText = s.name || s.id;
        if (s.color) {
            pill.style.background = s.color;
            pill.style.borderColor = s.color;
            pill.style.color = _tabTextColor(s.color);
        }
        pill.onclick = () => switchSession(s.id);
        pill.oncontextmenu = (e) => { e.preventDefault(); renameTab(s.id, s.name); };
        armLongPress(pill, () => renameTab(s.id, s.name));
        bar.appendChild(pill);
    });
}

// Naming a terminal. Blank clears a custom name and the tab shows its number.
function renameTab(sid, current) {
    const name = prompt('Name terminal ' + sid + ':',
                        current === sid ? '' : (current || ''));
    if (name === null) return;
    renameSession(sid, name.trim());
}

// Long-press = right-click on a touchscreen. 450ms, cancelled by any movement
// so a swipe between terminals never triggers it.
function armLongPress(el, fn) {
    let timer = null, moved = false;
    const clear = () => { clearTimeout(timer); timer = null; };
    el.addEventListener('touchstart', () => {
        moved = false;
        timer = setTimeout(() => { if (!moved) fn(); }, 450);
    }, {passive: true});
    el.addEventListener('touchmove', () => { moved = true; clear(); }, {passive: true});
    el.addEventListener('touchend', clear);
    el.addEventListener('touchcancel', clear);
}

// Pick black or white label text for a tab colour by perceived luminance, so a
// bright accent never gets unreadable white text.
function _tabTextColor(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substr(0, 2), 16),
          g = parseInt(c.substr(2, 2), 16),
          b = parseInt(c.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1a1a1a' : '#ffffff';
}

// --- Sync routine: make backend match what the frontend shows ---
async function syncSession() {
    try {
        await fetch('/api/session', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id: ACTIVE_SESSION}),
        });
    } catch(e) {}
    // Show correct iframe, hide others
    document.querySelectorAll('.terminal-wrap').forEach(w => {
        w.classList.toggle('term-hidden', w.id !== 'wrap-' + ACTIVE_SESSION);
    });
    applyTheme(ACTIVE_SESSION);
    document.body.focus();
}

// --- Auto-reconnect the ACTIVE terminal only (keeps one xterm in memory) ---
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        syncSession();
        refreshSessions();
        setTimeout(() => {
            loadActiveTerminal();
            unloadInactiveTerminals();
            document.body.focus();
        }, 300);
    }
});

// --- Keep focus on controls, not iframes ---
window.addEventListener('blur', () => {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            document.body.focus();
        }
    }, 100);
});

// --- Cleanup ---
window.addEventListener('beforeunload', () => {
    document.querySelectorAll('.terminal-frame').forEach(f => { try { f.src = 'about:blank'; } catch(e) {} });
    if (audioStream) audioStream.getTracks().forEach(t => t.stop());
    if (recorder && recorder.state === 'recording') try { recorder.stop(); } catch(e) {}
});

window.addEventListener('load', () => {
    syncSession();
    refreshSessions();
    setTimeout(() => document.body.focus(), 500);
});
setInterval(refreshSessions, 10000);
</script>
</body>
</html>
